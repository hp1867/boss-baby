<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOSS BABY</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  :root {
    --glow: #00e5ff;
    --glow-dim: rgba(0, 229, 255, 0.35);
    --amber: #ffb347;
    --red: #ff5566;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    background:
      radial-gradient(ellipse at 50% 35%, #0a1826 0%, #050b14 55%, #02050a 100%);
    color: #bfeaff;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(0, 229, 255, 0.18);
  }

  /* faint grid overlay */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--glow);
    box-shadow: 0 0 8px var(--glow);
    animation: blink 2.4s ease-in-out infinite;
  }
  .brand h1 {
    font-size: 15px; font-weight: 600;
    letter-spacing: 7px; color: #dff7ff;
  }
  .winbtns { display: flex; gap: 8px; }
  .winbtns button {
    width: 26px; height: 26px; border-radius: 6px;
    border: 1px solid rgba(0,229,255,0.25);
    background: rgba(0,229,255,0.06);
    color: #9adfff; font-size: 13px; line-height: 1;
    cursor: pointer;
  }
  .winbtns button:hover { background: rgba(0,229,255,0.18); }

  /* ---------- reactor ---------- */
  .stage {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 26px;
  }

  .reactor { position: relative; width: 250px; height: 250px; }

  .ring {
    position: absolute; border-radius: 50%;
    border: 2px solid transparent;
  }
  .ring1 {
    inset: 0;
    border: 2px dashed var(--glow-dim);
    animation: spin 14s linear infinite;
  }
  .ring2 {
    inset: 22px;
    border: 2px solid transparent;
    border-top-color: var(--glow);
    border-bottom-color: var(--glow);
    opacity: 0.55;
    animation: spinrev 6s linear infinite;
  }
  .ring3 {
    inset: 44px;
    border: 1px solid var(--glow-dim);
    box-shadow: inset 0 0 24px rgba(0,229,255,0.12);
  }
  .core {
    position: absolute; inset: 72px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #eaffff 0%, #7df3ff 28%, #0aa8c8 62%, #043445 100%);
    box-shadow: 0 0 34px 6px var(--glow-dim), 0 0 90px 12px rgba(0,229,255,0.18);
    animation: pulse 3.2s ease-in-out infinite;
  }
  .core::after {
    content: "";
    position: absolute; inset: 16%;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.55);
    opacity: 0.6;
  }

  /* equalizer bars (visible while speaking) */
  .eq { display: flex; gap: 6px; height: 30px; align-items: flex-end; visibility: hidden; }
  .eq span {
    width: 6px; border-radius: 3px;
    background: linear-gradient(180deg, var(--glow), rgba(0,229,255,0.25));
    box-shadow: 0 0 8px var(--glow-dim);
    animation: eq 0.9s ease-in-out infinite;
  }
  .eq span:nth-child(1) { animation-delay: 0s;    height: 40%; }
  .eq span:nth-child(2) { animation-delay: 0.15s; height: 80%; }
  .eq span:nth-child(3) { animation-delay: 0.3s;  height: 100%; }
  .eq span:nth-child(4) { animation-delay: 0.1s;  height: 70%; }
  .eq span:nth-child(5) { animation-delay: 0.25s; height: 50%; }

  .status {
    font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
    color: #8fd8f2; text-align: center; min-height: 16px;
    padding: 0 20px;
  }

  /* ---------- activity panel ---------- */
  .activity {
    border-top: 1px solid rgba(0,229,255,0.12);
    background: rgba(2, 8, 14, 0.75);
  }
  .act-header {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 18px;
    cursor: pointer;
  }
  .act-header:hover { background: rgba(0,229,255,0.05); }
  .act-arrow {
    flex: none;
    font-size: 10px; color: #59b8d6;
    transition: transform 0.2s;
  }
  .activity.open .act-arrow { transform: rotate(90deg); }
  .act-title {
    flex: none;
    font-size: 10px; letter-spacing: 3px; color: #59b8d6;
  }
  .act-now {
    flex: 1;
    font-family: Consolas, monospace;
    font-size: 11px; color: #9adfff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-align: right;
  }
  .act-log {
    display: none;
    max-height: 150px; overflow-y: auto;
    padding: 4px 18px 10px;
    font-family: Consolas, monospace;
    font-size: 11px; line-height: 1.6;
  }
  .activity.open .act-log { display: block; }
  .act-log .entry { color: #7fc9e8; }
  .act-log .entry .t { color: #3f7f99; margin-right: 8px; }
  .act-log::-webkit-scrollbar { width: 6px; }
  .act-log::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.2); border-radius: 3px; }

  /* ---------- transcript ---------- */
  .transcript {
    padding: 14px 18px 18px;
    display: flex; flex-direction: column; gap: 8px;
    border-top: 1px solid rgba(0,229,255,0.12);
    background: rgba(2, 8, 14, 0.6);
    min-height: 108px;
  }
  .line { display: flex; gap: 10px; font-size: 13px; line-height: 1.45; }
  .line .who {
    flex: none; width: 38px;
    font-size: 10px; letter-spacing: 2px; padding-top: 2px;
    color: #59b8d6;
  }
  .line .msg { color: #d8f4ff; max-height: 58px; overflow-y: auto; }
  .line.you .msg { color: #9adfff; }

  /* ---------- state variations ---------- */
  body.state-listening .core { animation-duration: 1.1s; }
  body.state-listening .ring2 { animation-duration: 2.5s; }

  body.state-thinking .core {
    background: radial-gradient(circle at 50% 45%, #fff4e0 0%, #ffcf8a 30%, #d98a1e 65%, #4a2c05 100%);
    box-shadow: 0 0 34px 6px rgba(255,179,71,0.35), 0 0 90px 12px rgba(255,179,71,0.15);
  }
  body.state-thinking .ring1 { border-color: rgba(255,179,71,0.4); animation-duration: 3s; }
  body.state-thinking .ring2 { border-top-color: var(--amber); border-bottom-color: var(--amber); animation-duration: 1.4s; }

  body.state-speaking .eq { visibility: visible; }

  body.state-error .core {
    background: radial-gradient(circle at 50% 45%, #ffe3e6 0%, #ff8a96 30%, #c8323f 65%, #440509 100%);
    box-shadow: 0 0 34px 6px rgba(255,85,102,0.35);
    animation: none;
  }
  body.state-error .status { color: var(--red); }

  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes spinrev { to { transform: rotate(-360deg); } }
  @keyframes pulse {
    0%, 100% { transform: scale(1);     filter: brightness(1); }
    50%      { transform: scale(1.06);  filter: brightness(1.25); }
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @keyframes eq {
    0%, 100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1); }
  }
</style>
</head>
<body class="state-idle">

  <div class="topbar pywebview-drag-region">
    <div class="brand">
      <div class="dot"></div>
      <h1>BOSS&nbsp;BABY</h1>
    </div>
    <div class="winbtns">
      <button title="Minimize" onclick="pywebview.api.minimize()">&#8211;</button>
      <button title="Close" onclick="pywebview.api.close()">&#10005;</button>
    </div>
  </div>

  <div class="stage">
    <div class="reactor">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>
      <div class="core"></div>
    </div>
    <div class="eq"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="status" id="status">BOOTING...</div>
  </div>

  <div class="activity" id="activity">
    <div class="act-header" onclick="bb.toggleLog()" title="Click to see the full activity log">
      <span class="act-arrow">&#9654;</span>
      <span class="act-title">ACTIVITY</span>
      <span class="act-now" id="actNow">booting...</span>
    </div>
    <div class="act-log" id="actLog"></div>
  </div>

  <div class="transcript">
    <div class="line you"><div class="who">YOU</div><div class="msg" id="userMsg">&mdash;</div></div>
    <div class="line"><div class="who">BB</div><div class="msg" id="replyMsg">Standing by, Boss.</div></div>
  </div>

<script>
  window.bb = {
    setState: function (state, status, user, reply) {
      document.body.className = "state-" + state;
      if (status !== null && status !== undefined && status !== "") {
        document.getElementById("status").textContent = status;
      }
      if (user !== null && user !== undefined) {
        document.getElementById("userMsg").textContent = user;
      }
      if (reply !== null && reply !== undefined) {
        document.getElementById("replyMsg").textContent = reply;
      }
    },

    toggleLog: function () {
      var panel = document.getElementById("activity");
      panel.classList.toggle("open");
      if (panel.classList.contains("open")) {
        var log = document.getElementById("actLog");
        log.scrollTop = log.scrollHeight;
      }
    },

    addLog: function (message) {
      document.getElementById("actNow").textContent = message;

      var log = document.getElementById("actLog");
      var now = new Date();
      var pad = function (n) { return (n < 10 ? "0" : "") + n; };
      var stamp = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());

      var entry = document.createElement("div");
      entry.className = "entry";
      var t = document.createElement("span");
      t.className = "t";
      t.textContent = stamp;
      entry.appendChild(t);
      entry.appendChild(document.createTextNode(message));
      log.appendChild(entry);

      while (log.children.length > 100) {
        log.removeChild(log.firstChild);
      }
      log.scrollTop = log.scrollHeight;
    }
  };
</script>
</body>
</html>
